<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Matrix — Supabase Connection Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #242529; }
  h1 { color: #2A377B; font-size: 20px; }
  .step { border: 1px solid #DCDCDD; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
  .pass { border-left: 4px solid #3F7D5C; }
  .fail { border-left: 4px solid #C23B22; }
  .pending { border-left: 4px solid #98989A; }
  code { background: #F2F2F0; padding: 2px 5px; border-radius: 3px; font-size: 13px; }
  button { background: #EA4E33; color: white; border: none; padding: 10px 18px; border-radius: 4px; font-size: 14px; cursor: pointer; }
  input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #DCDCDD; border-radius: 4px; box-sizing: border-box; }
  label { font-size: 13px; color: #6B6D72; }
</style>
</head>
<body>
<h1>Matrix Engineering — Supabase Connection Test</h1>
<p>This checks three things in order: that the database correctly <strong>refuses</strong> access to anyone not signed in, that the shared login can actually sign in, and that once signed in, access <strong>works</strong>. Nothing here touches your real app or its data.</p>

<label>Email</label>
<input id="email" type="text" value="dave@creasingmatrix.com" />
<label>Password</label>
<input id="password" type="password" placeholder="Enter the password you set for this user" />
<button onclick="runTest()">Run Test</button>

<div id="results" style="margin-top:20px;"></div>

<script>
const SUPABASE_URL = "https://bjoneyilyyvoemeiojzl.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZVnaPefnAgf4KfrBFkCmzw_3GfhiAnY";

function addResult(status, title, detail) {
  const div = document.createElement('div');
  div.className = 'step ' + status;
  div.innerHTML = '<strong>' + (status === 'pass' ? '✓' : status === 'fail' ? '✕' : '…') + ' ' + title + '</strong><br>' +
    '<span style="font-size:13px;color:#6B6D72">' + detail + '</span>';
  document.getElementById('results').appendChild(div);
  return div;
}

async function runTest() {
  document.getElementById('results').innerHTML = '';
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  // Step 1: no sign-in at all — this SHOULD fail if RLS is set up right
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  try {
    const { data, error } = await client.from('ncrs').select('*').limit(1);
    if (error) {
      addResult('pass', 'Step 1: Database correctly refuses access when not signed in', 'Got the expected error: ' + error.message);
    } else {
      addResult('fail', 'Step 1: Database allowed access with NO sign-in', 'Row Level Security is not active — re-check the policy SQL was run.');
      return;
    }
  } catch (e) {
    addResult('fail', 'Step 1: Could not reach Supabase at all', e.message + ' — check the project URL is correct and the project is running.');
    return;
  }

  // Step 2: sign in
  if (!password) {
    addResult('pending', 'Step 2 and 3: Skipped', 'Enter the password for ' + email + ' above and run again.');
    return;
  }
  const { data: signInData, error: signInError } = await client.auth.signInWithPassword({ email, password });
  if (signInError) {
    addResult('fail', 'Step 2: Sign-in failed', signInError.message + ' — double check the password, and that the user shows as confirmed in Supabase.');
    return;
  }
  addResult('pass', 'Step 2: Signed in successfully', 'Signed in as ' + email);

  // Step 3: now that we're signed in, access should work
  const { data: rows, error: readError } = await client.from('ncrs').select('*').limit(1);
  if (readError) {
    addResult('fail', 'Step 3: Access after sign-in failed', readError.message + ' — the policy SQL may not have run correctly.');
  } else {
    addResult('pass', 'Step 3: Access after sign-in works', 'Read ' + rows.length + ' row(s) successfully. The whole chain is working.');
  }
}
</script>
</body>
</html>
