# THE CLOUD ANSWER, DEPLOYED WITH EACH BUILD (23 Oct 2026, "work it out in the cloud").
# When a new index.html is uploaded, this takes the cloud-answer code out of it (it rides inside, checked by its
# fingerprint) and deploys the mx-truth function to Supabase with the official Supabase tool. Nothing else is touched.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens). It can also be run by hand
# from the Actions tab ("Run workflow"). Key added 25 Oct 2026 (scoped to the Matrix project: Edge Functions read-write, Project Settings read).
name: Cloud answer (mx-truth)
on:
  push:
    branches: [main]
    paths:
      - index.html
      - supabase/functions/mx-truth/index.ts
      - supabase/config.toml
      - .github/workflows/mx-truth.yml
      - .github/scripts/truth_code_from_index.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mx-truth
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: bjoneyilyyvoemeiojzl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Take the cloud-answer code out of index.html
        id: code
        run: node .github/scripts/truth_code_from_index.mjs index.html supabase/functions/mx-truth/truth_code.ts
      - name: Check the Supabase key is set
        if: steps.code.outputs.skip != '1'
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "The SUPABASE_ACCESS_TOKEN secret isn't set in this repository's Settings → Secrets and variables → Actions."; exit 1; fi
      - uses: supabase/setup-cli@v1
        if: steps.code.outputs.skip != '1'
        with:
          version: latest
      - name: Deploy mx-truth
        if: steps.code.outputs.skip != '1'
        run: supabase functions deploy mx-truth --project-ref "$PROJECT_ID" --no-verify-jwt
