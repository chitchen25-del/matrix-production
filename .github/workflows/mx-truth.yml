# THE CLOUD ANSWER, DEPLOYED WITH EACH BUILD (23 Oct 2026, "work it out in the cloud").
# When a new index.html is uploaded, this takes the cloud-answer code out of it (it rides inside, checked by its
# fingerprint) and deploys the mx-truth function to Supabase with the official Supabase tool. Nothing else is touched.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens). It can also be run by hand
# from the Actions tab ("Run workflow"). Key added 25 Oct 2026 (scoped to the Matrix project: Edge Functions read-write, Project Settings read).
name: Cloud answer (mx-truth)
on:
  push:
    branches: [main]
    paths:
      - index.html
      - supabase/functions/mx-truth/index.ts
      - supabase/config.toml
      - .github/workflows/mx-truth.yml
      - .github/scripts/truth_code_from_index.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mx-truth
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: bjoneyilyyvoemeiojzl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Take the cloud-answer code out of index.html
        id: code
        run: node .github/scripts/truth_code_from_index.mjs index.html supabase/functions/mx-truth/truth_code.ts
      - name: Check the Supabase key is set
        if: steps.code.outputs.skip != '1'
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "The SUPABASE_ACCESS_TOKEN secret isn't set in this repository's Settings → Secrets and variables → Actions."; exit 1; fi
      # 20 Nov 2026: "latest" is looked up through GitHub's API, which sometimes refuses ("rate limit exceeded") and failed the
      # deploy twice. Try once, wait a minute, try again; then say which version ran so it can be pinned.
      # 28 Nov 2026: it failed that way again (12:55, build 2026-11-28.4) — pinned to 3.4.0, the version the good runs used, so
      # nothing has to be looked up. Move the pin up by hand when a newer CLI is wanted.
      - uses: supabase/setup-cli@v1
        id: cli1
        if: steps.code.outputs.skip != '1'
        continue-on-error: true
        with:
          version: 3.4.0
      - name: Wait before asking for the CLI again
        if: steps.code.outputs.skip != '1' && steps.cli1.outcome == 'failure'
        run: sleep 60
      - uses: supabase/setup-cli@v1
        if: steps.code.outputs.skip != '1' && steps.cli1.outcome == 'failure'
        with:
          version: 3.4.0
      - name: Which Supabase CLI ran
        if: steps.code.outputs.skip != '1'
        run: supabase --version
      - name: Deploy mx-truth
        if: steps.code.outputs.skip != '1'
        # --yes (2 Nov 2026): the Supabase CLI now asks "Confirmation required: Deploy 1 Function" and, with no terminal,
        # stops ("Nothing was changed") — 2026-11-02.1's deploy failed on it three times.
        run: supabase functions deploy mx-truth --project-ref "$PROJECT_ID" --no-verify-jwt --yes
      - name: Deploy mx-truth-part (the same function again — the run asks it for the pieces)
        if: steps.code.outputs.skip != '1'
        # 16 Nov 2026: the pieces of the answer are worked out by a second copy of this very function, so a piece that
        # uses up its worker can't take the run down with it. Same folder, same code, same commit; the run checks the
        # copy's fingerprint and does the pieces itself if the copy is missing or on other code.
        run: |
          rm -rf supabase/functions/mx-truth-part
          cp -r supabase/functions/mx-truth supabase/functions/mx-truth-part
          supabase functions deploy mx-truth-part --project-ref "$PROJECT_ID" --no-verify-jwt --yes
