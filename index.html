<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Matrix Engineering — Production Control</title>

<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />

<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #EDEEE8; -webkit-font-smoothing: antialiased; }
.font-display { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }
.font-mono { font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
table { border-collapse: collapse; }
::selection { background: #EA4E3355; }
/* Minimal, hand-rolled utility CSS — replaces the Tailwind CDN dependency
   so the app has zero external runtime dependencies. */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
.flex { display: flex; }
.inline-flex { display: inline-flex; }
.grid { display: grid; }
.block { display: block; }
.hidden { display: none; }
.flex-1 { flex: 1 1 0%; }
.flex-wrap { flex-wrap: wrap; }
.shrink-0 { flex-shrink: 0; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.items-end { align-items: flex-end; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-1\.5 { gap: .375rem; } .gap-2 { gap: .5rem; } .gap-2\.5 { gap: .625rem; }
.gap-3 { gap: .75rem; } .gap-4 { gap: 1rem; } .gap-5 { gap: 1.25rem; } .gap-6 { gap: 1.5rem; }
.space-y-0\.5 > * + * { margin-top: .125rem; }
.space-y-2 > * + * { margin-top: .5rem; }
.w-9 { width: 2.25rem; } .w-16 { width: 4rem; } .w-20 { width: 5rem; } .w-60 { width: 15rem; }
.w-full { width: 100%; }
.h-9 { height: 2.25rem; } .h-1\.5 { height: .375rem; } .h-full { height: 100%; }
.min-h-screen { min-height: 100vh; }
.min-w-\[160px\] { min-width: 160px; }
.min-w-\[180px\] { min-width: 180px; }
.rounded { border-radius: .25rem; }
.rounded-md { border-radius: .375rem; }
.rounded-full { border-radius: 9999px; }
.p-4 { padding: 1rem; } .p-8 { padding: 2rem; }
.px-1\.5 { padding-left: .375rem; padding-right: .375rem; }
.px-2 { padding-left: .5rem; padding-right: .5rem; }
.px-2\.5 { padding-left: .625rem; padding-right: .625rem; }
.px-3 { padding-left: .75rem; padding-right: .75rem; }
.px-4 { padding-left: 1rem; padding-right: 1rem; }
.py-0\.5 { padding-top: .125rem; padding-bottom: .125rem; }
.py-1\.5 { padding-top: .375rem; padding-bottom: .375rem; }
.py-2 { padding-top: .5rem; padding-bottom: .5rem; }
.py-3 { padding-top: .75rem; padding-bottom: .75rem; }
.py-8 { padding-top: 2rem; padding-bottom: 2rem; }
.pb-4 { padding-bottom: 1rem; } .pt-4 { padding-top: 1rem; }
.mb-1 { margin-bottom: .25rem; } .mb-2 { margin-bottom: .5rem; } .mb-3 { margin-bottom: .75rem; }
.mb-4 { margin-bottom: 1rem; } .mb-5 { margin-bottom: 1.25rem; } .mb-6 { margin-bottom: 1.5rem; }
.mt-1 { margin-top: .25rem; } .mt-3 { margin-top: .75rem; }
.text-center { text-align: center; } .text-left { text-align: left; } .text-right { text-align: right; }
.text-xs { font-size: .75rem; line-height: 1rem; }
.text-sm { font-size: .875rem; line-height: 1.25rem; }
.text-xl { font-size: 1.25rem; line-height: 1.75rem; }
.text-white { color: #fff; }
.font-medium { font-weight: 500; } .font-semibold { font-weight: 600; } .font-bold { font-weight: 700; }
.tracking-wide { letter-spacing: .025em; }
.uppercase { text-transform: uppercase; }
.border-t { border-top: 1px solid currentColor; }
.overflow-hidden { overflow: hidden; }
.overflow-x-auto { overflow-x: auto; }
.bg-white { background-color: #fff; }
.outline-none { outline: none; }
.opacity-40 { opacity: .4; } .opacity-50 { opacity: .5; } .opacity-60 { opacity: .6; }
.shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,.15), 0 4px 6px -4px rgba(0,0,0,.15); }
.transition-colors { transition: background-color .15s, color .15s; }
.transition-opacity { transition: opacity .15s; }
.fixed { position: fixed; }
.bottom-5 { bottom: 1.25rem; } .right-5 { right: 1.25rem; }
.hover\:opacity-85:hover { opacity: .85; }
.hover\:opacity-100:hover { opacity: 1; }
.hover\:bg-black\/\[0\.02\]:hover { background-color: rgba(0,0,0,.02); }
.disabled\:opacity-40:disabled { opacity: .4; }
button { cursor: pointer; }
input, select, textarea { font: inherit; }
table { min-width: 100%; }
.no-wrap { white-space: nowrap; }

/* ---------- Print styling: clean, standalone packing list ---------- */
.print-only { display: none; }
@media print {
  .no-print { display: none !important; }
  .print-only { display: block !important; }
  body { background: #fff !important; }
  main { padding: 0 !important; max-width: 100% !important; }
  .print-clean { box-shadow: none !important; border: none !important; border-radius: 0 !important; }
  input[type="number"] { border: none !important; background: transparent !important; padding: 0 !important; -webkit-appearance: none; outline: none !important; box-shadow: none !important; }
  input[type="number"]:focus { border: none !important; outline: none !important; box-shadow: none !important; }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  table { page-break-inside: auto; }
  tr { page-break-inside: avoid; }
}
