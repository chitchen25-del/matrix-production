<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
<title>Matrix Engineering — Production Control</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* No overflow-x: hidden here — that was tried as a safety net against
     stray width bugs, but it's too blunt an instrument: it also blocks
     genuinely intentional horizontal scrolling that other screens rely
     on (wide tables wider than a phone viewport by design, meant to be
     scrolled sideways to see every column). Blocking that to catch a
     bug is a worse trade than just fixing the bug — which is what
     actually happened since (flex-shrink math, panel width constraints,
     the pick-by-phone stepper redesign). Real overflow bugs get fixed
     at their source now, not hidden after the fact. */
  html, body { margin: 0; padding: 0; background: #F4F4F2; }
  * { box-sizing: border-box; }

  /* Native number-input spin arrows reserve a different amount of width
     in Safari than in Chrome — exactly the kind of few-pixels-per-input
     difference that adds up across a row of inputs and can push a layout
     that fits perfectly in Chrome just barely over the edge in Safari.
     Every number input in this app already has its own explicit +/−
     stepper buttons where that matters, so the native spinner is pure
     redundant risk with no upside — removed everywhere. */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  /* Sidebar nav buttons — compact by default (desktop). Making these
     taller for a "bigger, more aesthetically appealing" pass ended up
     overflowing the nav's own internal scroll box (see maxHeight/
     overflowY on the <nav> in app_source_v7.jsx), producing a visible
     scrollbar inside the sidebar on a normal desktop screen. Only sized
     up for genuine touch use below 960px, where there's no competing
     desktop layout to protect. */
  .nav-item-btn { padding: 8px 12px; font-size: 13px; border-radius: 8px; margin-bottom: 4px; }
  .nav-icon-chip { width: 26px; height: 26px; border-radius: 6px; }

  /* Mobile header (hamburger + logo) — hidden on desktop, shown below 960px */
  .mobile-header { display: none; }

  /* Generic show/hide pair for anything that needs a genuinely different
     rendering on phone vs desktop, not just a resized version of the
     same one — same 960px line as everything else. Line items on an
     order: desktop keeps the full priced table always; phone gets a
     plain product-and-quantity list while just viewing (nobody picking
     boxes on the shop floor needs unit prices in front of them), and
     only sees the full table once they've actually tapped into editing
     it, where every field genuinely is needed. */
  .mobile-only { display: none; }
  .desktop-only { display: block; }
  @media (max-width: 960px) {
    .mobile-only { display: block; }
    .desktop-only { display: none; }
  }

  /* Order detail page's two-column layout — order info + line items on
     the left, "On the shelf now" / "What's left to make" cards on the
     right. A fixed two-column grid has no way to know it's run out of
     room on a phone; it just keeps trying to lay both columns out side
     by side, which on a narrow screen makes the right column overlap
     the left one instead of properly stacking underneath it. Collapsing
     to a single column below the same 960px breakpoint everything else
     in the app already uses is what actually fixes it. */
  .order-detail-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); gap: 16px; }
  @media (max-width: 960px) {
    .order-detail-grid { grid-template-columns: 1fr; }
  }

  /* Sidebar backdrop overlay — hidden unless the mobile drawer is open */
  .sidebar-backdrop { display: none; }

  @media (max-width: 960px) {
    .nav-item-btn { padding: 14px 16px; font-size: 14px; border-radius: 10px; margin-bottom: 6px; }
    .nav-icon-chip { width: 30px; height: 30px; border-radius: 8px; }

    .mobile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #DCDCDD;
      position: sticky;
      top: 0;
      z-index: 110;
    }

    /* On mobile the sidebar is an off-canvas drawer, not a static flex
       column next to the content — without this rule it sits inline at
       its full desktop width (240px) and squeezes/overflows the main
       content sideways on a narrow phone screen, which is the exact bug
       this fixes. */
    .app-sidebar {
      position: fixed !important;
      top: 0;
      left: 0;
      bottom: 0;
      height: 100vh;
      z-index: 130;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      overflow-y: auto;
    }
    .app-sidebar.mobile-open {
      transform: translateX(0);
    }

    .sidebar-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(15, 20, 35, 0.5);
      z-index: 120;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .sidebar-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* With the sidebar taken out of normal flow above, main is the only
       in-flow flex item left and takes full width naturally — this just
       trims its padding down from the desktop p-8 so content isn't
       pushed too far in on a small screen. */
    .app-main {
      padding: 1.25rem !important;
    }
  }

  @media print {
    .no-print { display: none !important; }
    .print-only { display: block !important; }

    /* html defaults to filling the full browser viewport height (matched
       directly against a real print — confirmed this exact behaviour is
       what caused the label to spill onto extra blank/overflow labels
       even with the page correctly sized to 65mm x 25mm above). Print
       pagination is driven by the WHOLE document's height, not just the
       visible content, so that leftover viewport-sized height was
       enough on its own to force a second (and with the browser's own
       header/footer added on top, a third) near-empty label to print.
       Collapsing html/body down to their actual content height for
       print fixes it at the source, regardless of what else is (or was
       supposed to be) hidden via .no-print. */
    html, body { height: auto !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; }

    /* The app's own outermost wrapper carries an INLINE minHeight:100vh
       (so the layout never looks broken-short on a tall empty screen) —
       inline styles ignore media queries entirely, so this stayed
       100vh even while printing, which was the actual remaining cause
       of a trailing blank second label after the real one: the total
       printed document was still viewport-height tall even though the
       label itself only used a fraction of that. A stylesheet rule is
       the one thing that can override a plain inline style, provided
       it's !important, which is exactly what this is for. */
    .app-root { min-height: 0 !important; }
  }
  .print-only { display: none; }
</style>
<!-- Populated at print-time only for the reel label job (65mm x 25mm
     continuous label stock) — see printLabel() in app_source_v7.jsx.
     Left empty the rest of the time so every other print job (Packing
     List, schedules, etc.) uses the normal full page size untouched. A
     plain @page { size } rule with no scoping — a page size can't be
     tied to one element via CSS alone in this browser, so this element
     is emptied again immediately after printing rather than staying set. -->
<style id="print-page-size"></style>
</head>
